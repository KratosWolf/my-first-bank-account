# ⚠️ AGENDAMENTO DESLIGADO — Task 3.11 (2026-09-08)
#
# O agendamento passou para o Vercel Cron (ver `crons` no vercel.json).
# Motivo: o GitHub desativa cada workflow agendado INDIVIDUALMENTE, no seu
# próprio disparo seguinte, após 60 dias sem atividade no repo — e a última
# execução antes do silêncio é sempre verde. Foi assim que a mesada de agosto
# e 5 meses de juros falharam sem ninguém dar por nada.
#
# Este ficheiro fica como FERRAMENTA MANUAL (workflow_dispatch), que é como se
# correu o backfill da Fase C em junho. Sem `schedule:`, a regra dos 60 dias
# não se aplica.

name: Keep Supabase Alive

on:
  workflow_dispatch: # Disparo manual — ver /api/cron/keep-alive

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        run: |
          echo "🏓 Enviando ping para Supabase..."

          response=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://mqcfdwyhbtvaclslured.supabase.co/rest/v1/families?select=id&limit=1")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "📊 Status HTTP: $http_code"
          echo "📦 Resposta: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Supabase está ATIVO e respondendo!"
            exit 0
          else
            echo "❌ Erro ao pingar Supabase (HTTP $http_code)"
            exit 1
          fi

      - name: Log Execution Time
        if: always()
        run: |
          echo "⏰ Executado em: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📅 Próxima execução: Domingo ou Quarta às 9h UTC"
